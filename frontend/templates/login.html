<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>SmartAttend - Login</title>
</head>

<body>

    <header>
        <h1>SmartAttend</h1>
    </header>

    <main>

        <section>
            <h2>Welcome Back</h2>

            <p>Sign in to continue to SmartAttend</p>

            <form>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >


                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                >

   

                <a href="#">Forgot Password?</a>

 

                <a href="admin-dashboard.html">Login</a>
            </form>

        </section>

    </main>

</body>

</html>

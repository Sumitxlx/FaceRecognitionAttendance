<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102d38">
    <title>{% block title %}SmartAttend{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=ui-refresh-20261027">
</head>
<body class="public-site">
    <header class="public-header">
        <a href="/" class="public-brand" aria-label="SmartAttend home">
            <span class="brand-mark">SA</span>
            <span><strong>SmartAttend</strong><small>Attendance, made clear</small></span>
        </a>
        <nav class="public-nav" aria-label="Main navigation">
            <a href="#features">Features</a>
            <a href="#how-it-works">How it works</a>
            <a href="/login" class="public-nav-cta">Sign in <span aria-hidden="true">→</span></a>
        </nav>
    </header>
    <main class="public-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="public-footer">
        <span>© 2026 SmartAttend</span>
        <span>Privacy-first attendance management</span>
    </footer>
</body>
</html>
